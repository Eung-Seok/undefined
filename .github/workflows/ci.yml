name: CI

on:
  push:
    branches: [main, portfolio-v2]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Build WAR
        run: mvn -B -f Project/pom.xml -DskipTests package
